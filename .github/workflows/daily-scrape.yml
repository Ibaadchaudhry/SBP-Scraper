name: Daily SBP circulars scrape

on:
  schedule:
    # GitHub Actions schedules always run in UTC.
    # 03:00 UTC = 08:00 AM Pakistan Time (PKT, UTC+5).
    # If you want a different local time, adjust this line and the
    # comment above it accordingly.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so this workflow can commit the updated files back

# Two scrapes pushing data commits at the same time would race each other,
# so let one finish before the next starts.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Without this, "Re-run all jobs" checks out the commit the run
          # was originally created from, not the current branch -- so a
          # re-run of yesterday's run silently scrapes with yesterday's
          # code and then fails to push on top of today's branch.
          ref: ${{ github.ref_name }}
          # Full history, so the push step below can rebase if it loses a race.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scraper
        env:
          SBP_SMTP_HOST: ${{ secrets.SBP_SMTP_HOST }}
          SBP_SMTP_PORT: ${{ secrets.SBP_SMTP_PORT }}
          SBP_SMTP_USER: ${{ secrets.SBP_SMTP_USER }}
          SBP_SMTP_PASS: ${{ secrets.SBP_SMTP_PASS }}
        run: python scrape.py --category "Microfinance" --alert-email "ibaad.ahmed@mobilinkbank.com"
        # Add more flags here if you need them, e.g.:
        #   python scrape.py --category "Microfinance" --department "BPRD"
        #
        # Email alerts on GitHub Actions go through SMTP via Gmail (see
        # the env: block above), not Outlook -- Outlook only works on
        # Windows. Set SBP_SMTP_HOST=smtp.gmail.com, SBP_SMTP_PORT=587,
        # SBP_SMTP_USER=<your gmail>, SBP_SMTP_PASS=<gmail app password>
        # as repo Secrets (Settings → Secrets and variables → Actions)
        # for this to actually send -- see README for how to generate
        # a Gmail App Password. Without these set, the run still
        # completes fine, it just skips the email with a warning.

      - name: Commit updated data back to the repo
        run: |
          git config user.name "sbp-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sbp_circulars.csv sbp_circulars_changelog.json sbp_scraper.log

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # If someone pushed to the branch while we were scraping, our push
          # is rejected as a non-fast-forward. Replay our data commit on top
          # of theirs and try again rather than failing the whole run.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto the latest ${GITHUB_REF_NAME} and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $(( attempt * 5 ))
          done

          echo "Still could not push after 3 attempts."
          exit 1
