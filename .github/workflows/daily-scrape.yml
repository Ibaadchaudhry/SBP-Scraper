name: Daily SBP circulars scrape

on:
  schedule:
    # GitHub Actions schedules always run in UTC.
    # 04:00 UTC = 09:00 AM Pakistan Time (PKT, UTC+5).
    # If you want a different local time, adjust this line and the
    # comment above it accordingly.
    - cron: "0 4 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so this workflow can commit the updated files back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scraper
        env:
          SBP_SMTP_HOST: ${{ secrets.SBP_SMTP_HOST }}
          SBP_SMTP_PORT: ${{ secrets.SBP_SMTP_PORT }}
          SBP_SMTP_USER: ${{ secrets.SBP_SMTP_USER }}
          SBP_SMTP_PASS: ${{ secrets.SBP_SMTP_PASS }}
        run: python scrape.py --category "Microfinance" --alert-email "ibaad.ahmed@mobilinkbank.com"
        # Add more flags here if you need them, e.g.:
        #   python scrape.py --category "Microfinance" --department "BPRD"
        #
        # Email alerts on GitHub Actions go through SMTP via Gmail (see
        # the env: block above), not Outlook -- Outlook only works on
        # Windows. Set SBP_SMTP_HOST=smtp.gmail.com, SBP_SMTP_PORT=587,
        # SBP_SMTP_USER=<your gmail>, SBP_SMTP_PASS=<gmail app password>
        # as repo Secrets (Settings → Secrets and variables → Actions)
        # for this to actually send -- see README for how to generate
        # a Gmail App Password. Without these set, the run still
        # completes fine, it just skips the email with a warning.

      - name: Commit updated data back to the repo
        run: |
          git config user.name "sbp-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sbp_circulars.csv sbp_circulars_changelog.json sbp_scraper.log
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Daily scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
