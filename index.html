<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Register — SBP Filings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ============ TOKENS ============ */
    :root {
      --ink-bg: #0a0d09;
      --paper-card: #12160f;
      --paper-card-raised: #161b13;
      --hairline: rgba(240, 237, 225, 0.10);
      --hairline-strong: rgba(240, 237, 225, 0.18);
      --bone: #f2efe3;
      --bone-muted: #9a9a89;
      --bone-faint: #6c6c5e;
      --seal-gold: #cc9f35;
      --seal-gold-bg: rgba(204, 159, 53, 0.10);
      --seal-red: #b1462f;
      --seal-red-bg: rgba(177, 70, 47, 0.10);
      --seal-green: #4d8161;
      --seal-green-bg: rgba(77, 129, 97, 0.12);
      --radius: 10px;
      --radius-lg: 16px;
      --shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; }
    ::selection { background: var(--seal-gold-bg); color: var(--seal-gold); }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse 900px 500px at 50% -10%, rgba(77, 129, 97, 0.08), transparent 60%),
        var(--ink-bg);
      color: var(--bone);
      font-family: "Inter", -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ============ MASTHEAD ============ */
    .masthead {
      text-align: center;
      padding: 40px 24px 28px;
      border-bottom: 1px solid var(--hairline);
      position: relative;
    }

    .dateline {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bone-faint);
      margin-bottom: 14px;
    }

    .dateline .sep { margin: 0 10px; color: var(--hairline-strong); }

    .masthead h1 {
      font-family: "Fraunces", serif;
      font-optical-sizing: auto;
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 3.2rem);
      letter-spacing: -0.01em;
      margin: 0;
      line-height: 1;
    }

    .masthead .subtitle {
      font-family: "Fraunces", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1rem;
      color: var(--bone-muted);
      margin-top: 10px;
    }

    .header-actions {
      position: absolute;
      top: 40px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-note {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      color: var(--bone-faint);
      letter-spacing: 0.06em;
    }

    .stamp-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--hairline-strong);
      border-radius: 999px;
      padding: 5px 12px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: var(--seal-green);
      background: var(--seal-green-bg);
    }

    .stamp-status.stale { color: var(--seal-gold); background: var(--seal-gold-bg); }

    .stamp-status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor; box-shadow: 0 0 6px currentColor;
    }

    .stamp-status.live .dot { animation: pulse-dot 2.2s ease-in-out infinite; }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 24px 72px;
    }

    /* ============ SIGNATURE: HERO BULLETIN ============ */
    .bulletin {
      border: 1px solid var(--hairline-strong);
      border-radius: var(--radius-lg);
      background: var(--paper-card-raised);
      box-shadow: var(--shadow);
      padding: 28px 32px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      animation: settleIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .bulletin::before {
      content: "";
      position: absolute; inset: 0 0 auto 0; height: 3px;
      background: linear-gradient(90deg, var(--seal-gold), transparent 60%);
      opacity: 0.7;
    }

    .bulletin.quiet::before { background: linear-gradient(90deg, var(--seal-green), transparent 60%); }

    .bulletin-head {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 4px;
    }

    .seal {
      flex: none;
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid var(--seal-gold);
      display: flex; align-items: center; justify-content: center;
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--seal-gold);
      background: var(--seal-gold-bg);
      position: relative;
    }

    .seal::after {
      content: "";
      position: absolute; inset: -6px;
      border: 1px dashed rgba(204, 159, 53, 0.35);
      border-radius: 50%;
    }

    .bulletin.quiet .seal {
      border-color: var(--seal-green);
      color: var(--seal-green);
      background: var(--seal-green-bg);
    }

    .bulletin.quiet .seal::after { border-color: rgba(77, 129, 97, 0.35); }

    .bulletin h2 {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: 1.5rem;
      margin: 4px 0 4px;
      line-height: 1.15;
    }

    .bulletin .meta {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      color: var(--bone-faint);
    }

    .bulletin ul {
      list-style: none;
      margin: 18px 0 0;
      padding: 16px 0 0;
      border-top: 1px dashed var(--hairline-strong);
    }

    .bulletin li {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 8px 0;
      font-size: 0.92rem;
    }

    .chit {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.64rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      flex: none;
      font-weight: 600;
    }

    .chit.added { background: var(--seal-gold-bg); color: var(--seal-gold); border: 1px solid rgba(204, 159, 53, 0.3); }
    .chit.removed { background: var(--seal-red-bg); color: var(--seal-red); border: 1px solid rgba(177, 70, 47, 0.3); }

    .bulletin li.removed-item span.title { color: var(--bone-faint); text-decoration: line-through; text-decoration-color: rgba(177,70,47,0.4); }

    .bulletin a {
      color: var(--bone);
      text-decoration: none;
      border-bottom: 1px solid var(--hairline-strong);
    }
    .bulletin a:hover { color: var(--seal-gold); border-color: var(--seal-gold); }

    /* ============ LEDGER STRIP (demoted) ============ */
    .ledger-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 24px;
      background: var(--paper-card);
    }

    .ledger-cell {
      flex: 1 1 140px;
      padding: 12px 18px;
      border-right: 1px solid var(--hairline);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .ledger-cell:last-child { border-right: none; }

    .ledger-cell .num {
      font-family: "JetBrains Mono", monospace;
      font-weight: 600;
      font-size: 1rem;
      color: var(--bone);
    }

    .ledger-cell .label {
      font-size: 0.68rem;
      font-family: "JetBrains Mono", monospace;
      color: var(--bone-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ============ CONTROLS ============ */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
      padding: 14px 16px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      background: var(--paper-card);
    }

    .controls input[type="text"],
    .controls select,
    .controls input[type="date"] {
      font-family: "Inter", sans-serif;
      font-size: 0.84rem;
      padding: 9px 12px;
      border: 1px solid var(--hairline-strong);
      border-radius: 6px;
      background: rgba(255,255,255,0.02);
      color: var(--bone);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .controls input:focus, .controls select:focus {
      border-color: var(--seal-green);
    }

    .controls input[type="text"] { flex: 1 1 220px; }

    .controls .date-group {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; color: var(--bone-faint);
      font-family: "JetBrains Mono", monospace;
    }

    .controls button {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 9px 16px;
      border: 1px solid var(--seal-green);
      background: var(--seal-green-bg);
      color: var(--seal-green);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .controls button:hover { background: var(--seal-green); color: var(--ink-bg); }

    .controls button.ghost {
      background: transparent; color: var(--bone-muted); border-color: var(--hairline-strong);
    }
    .controls button.ghost:hover { border-color: var(--bone-muted); color: var(--bone); background: transparent; }

    .controls label.toggle {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.78rem; color: var(--bone-faint); cursor: pointer;
      font-family: "JetBrains Mono", monospace; user-select: none;
    }

    /* ============ TIMELINE TABLE ============ */
    .month-divider {
      font-family: "Fraunces", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--bone-muted);
      padding: 22px 4px 8px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 4px;
    }

    .month-divider:first-child { padding-top: 4px; }

    .filing-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 16px;
      align-items: center;
      padding: 14px 6px;
      border-bottom: 1px solid var(--hairline);
      transition: background 0.15s ease;
    }

    .filing-row:hover { background: rgba(255,255,255,0.015); }

    .filing-row.is-new {
      animation: newEntry 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .filing-row .title a {
      color: var(--bone);
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 500;
      line-height: 1.35;
    }

    .filing-row .title a:hover { color: var(--seal-gold); text-decoration: underline; }

    .filing-row .circno {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.76rem;
      color: var(--bone-faint);
      white-space: nowrap;
    }

    .filing-row .date {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.76rem;
      color: var(--bone-muted);
      white-space: nowrap;
    }

    .chip-group { display: flex; gap: 6px; }

    .chip {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.66rem;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--hairline-strong);
      color: var(--bone-muted);
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip.category { border-color: rgba(77, 129, 97, 0.35); color: var(--seal-green); }

    thead-labels {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 16px;
      padding: 0 6px 8px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--bone-faint);
      cursor: pointer;
    }

    .thead-labels span:hover { color: var(--bone); }
    .thead-labels .arrow { opacity: 0.6; margin-left: 4px; color: var(--seal-gold); }

    .empty {
      padding: 56px 24px;
      text-align: center;
      color: var(--bone-muted);
    }

    .empty .plate {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid var(--seal-red);
      color: var(--seal-red);
      background: var(--seal-red-bg);
      display: inline-block;
      padding: 8px 20px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    footer {
      max-width: 980px;
      margin: 32px auto 0;
      padding: 24px 24px 0;
      font-size: 0.74rem;
      color: var(--bone-faint);
      font-family: "JetBrains Mono", monospace;
      border-top: 1px solid var(--hairline);
      text-align: center;
      letter-spacing: 0.04em;
    }

    @media (max-width: 640px) {
      .header-actions { position: static; justify-content: center; margin-top: 16px; }
      .masthead { padding: 28px 16px 24px; }
      .controls { flex-direction: column; align-items: stretch; }
      .controls input[type="text"] { flex: 1 1 100%; }
      .filing-row { grid-template-columns: 1fr; gap: 4px; padding: 12px 4px; }
      .thead-labels { display: none; }
      .chip-group { margin-top: 4px; }
    }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--seal-green);
      outline-offset: 2px;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    @keyframes settleIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes newEntry {
      0%   { opacity: 0; transform: translateY(-6px); background: rgba(204, 159, 53, 0.14); }
      60%  { opacity: 1; transform: translateY(0); background: rgba(204, 159, 53, 0.10); }
      100% { background: transparent; }
    }
  </style>
</head>

<body>

  <div class="masthead">
    <div class="header-actions">
      <span class="theme-note">DARK LEDGER</span>
      <div id="syncStamp" class="stamp-status live"><span class="dot"></span>Connecting…</div>
    </div>
    <div class="dateline">State Bank of Pakistan<span class="sep">·</span>Filing Intelligence<span class="sep">·</span>Issued Continuously</div>
    <h1>Circular Register</h1>
    <div class="subtitle">A running account of every filing, as it happens</div>
  </div>

  <main>

    <div id="bulletin"></div>

    <div id="ledgerStrip" class="ledger-strip"></div>

    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search title or circular no.">
      <select id="categoryFilter"><option value="">All categories</option></select>
      <select id="typeFilter"><option value="">All circular types</option></select>
      <div class="date-group">
        from <input type="date" id="dateFrom">
        to <input type="date" id="dateTo">
      </div>
      <label class="toggle"><input type="checkbox" id="autoRefresh"> Auto-refresh (30s)</label>
      <button class="ghost" id="resetBtn" type="button">Reset</button>
      <button id="refreshBtn" type="button">Reload</button>
    </div>

    <div class="thead-labels" id="theadLabels">
      <span data-key="title">Title<span class="arrow"></span></span>
      <span data-key="circular_no">No.<span class="arrow"></span></span>
      <span data-key="date">Date<span class="arrow"></span></span>
      <span>Category / Type</span>
    </div>

    <div id="tableBody"></div>
    <div id="emptyState" class="empty" style="display:none;"></div>

  </main>

  <footer>State Bank of Pakistan Live Filing Monitor</footer>

  <script>
    const state = { rows: [], sortKey: 'date', sortDir: 'desc', changelog: null, seenUrls: new Set(), firstLoad: true };

    const MONTHS = { January: 0, February: 1, March: 2, April: 3, May: 4, June: 5, July: 6, August: 7, September: 8, October: 9, November: 10, December: 11 };
    function parseDate(str) {
      if (!str) return null;
      const m = String(str).match(/(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2})\s+(\d{4})/);
      if (!m) return null;
      return new Date(Number(m[3]), MONTHS[m[1]], Number(m[2]));
    }

    async function fetchJSON(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      return res.json();
    }

    function setStamp(ok, text) {
      const el = document.getElementById('syncStamp');
      el.className = 'stamp-status ' + (ok ? 'live' : 'stale');
      el.innerHTML = '<span class="dot"></span>' + text;
    }

    function formatCategory(raw) {
      if (!raw) return '';
      const parts = raw.split('/').map(p => p.trim()).filter(Boolean);
      if (parts.length === 0) return '';
      const [fullName] = parts;
      if (fullName && !/^[A-Z0-9]{2,8}$/.test(fullName)) return fullName;
      return parts.join(' / ');
    }

    function renderBulletin(cl) {
      const el = document.getElementById('bulletin');
      if (!cl || !cl.changed) {
        el.innerHTML = `
          <div class="bulletin quiet">
            <div class="bulletin-head">
              <div class="seal">✓</div>
              <div>
                <h2>No change on last check</h2>
                <div class="meta">${cl && cl.checked_at ? 'Last checked ' + new Date(cl.checked_at).toLocaleString() : 'Waiting for first scrape run.'}</div>
              </div>
            </div>
          </div>`;
        return;
      }
      const addedCount = (cl.added || []).length;
      const removedCount = (cl.removed || []).length;
      const items = [
        ...(cl.added || []).map(r => `<li><span class="chit added">New</span><a href="${r.url}" target="_blank" rel="noopener" class="title">${r.title}</a></li>`),
        ...(cl.removed || []).map(r => `<li class="removed-item"><span class="chit removed">Gone</span><span class="title">${r.title}</span></li>`),
      ].join('');
      el.innerHTML = `
        <div class="bulletin">
          <div class="bulletin-head">
            <div class="seal">${addedCount}</div>
            <div>
              <h2>${addedCount} new filing${addedCount === 1 ? '' : 's'}${removedCount ? `, ${removedCount} removed` : ''}</h2>
              <div class="meta">Checked ${new Date(cl.checked_at).toLocaleString()} · ${cl.old_count} → ${cl.new_count} total</div>
            </div>
          </div>
          <ul>${items}</ul>
        </div>`;
    }

    function renderLedgerStrip(rows) {
      const cats = new Set(rows.map(r => r.category).filter(Boolean));
      const dates = rows.map(r => parseDate(r.date)).filter(Boolean).sort((a, b) => a - b);
      const fmt = d => d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
      const cells = [
        [rows.length, 'Total Filings'],
        [cats.size, 'Categories'],
        [dates.length ? fmt(dates[0]) : '—', 'Earliest'],
        [dates.length ? fmt(dates[dates.length - 1]) : '—', 'Latest'],
      ];
      document.getElementById('ledgerStrip').innerHTML = cells.map(([num, label]) => `
        <div class="ledger-cell"><span class="num">${num}</span><span class="label">${label}</span></div>
      `).join('');
    }

    function populateFilters(rows) {
      const catSel = document.getElementById('categoryFilter');
      const typeSel = document.getElementById('typeFilter');
      const cats = [...new Set(rows.map(r => r.category).filter(Boolean))].sort();
      const types = [...new Set(rows.map(r => r.circular_type).filter(Boolean))].sort();
      catSel.innerHTML = '<option value="">All categories</option>';
      cats.forEach(c => catSel.appendChild(new Option(c, c)));
      typeSel.innerHTML = '<option value="">All circular types</option>';
      types.forEach(t => typeSel.appendChild(new Option(t, t)));
    }

    function monthLabel(d) {
      if (!d) return 'Undated';
      return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function applyFiltersAndRender() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      const type = document.getElementById('typeFilter').value;
      const from = document.getElementById('dateFrom').value ? new Date(document.getElementById('dateFrom').value) : null;
      const to = document.getElementById('dateTo').value ? new Date(document.getElementById('dateTo').value) : null;

      let rows = state.rows.filter(r => {
        if (q && !(String(r.title).toLowerCase().includes(q) || String(r.circular_no).toLowerCase().includes(q))) return false;
        if (cat && r.category !== cat) return false;
        if (type && r.circular_type !== type) return false;
        const d = parseDate(r.date);
        if (from && (!d || d < from)) return false;
        if (to && (!d || d > to)) return false;
        return true;
      });

      rows.sort((a, b) => {
        let av = a[state.sortKey], bv = b[state.sortKey];
        if (state.sortKey === 'date') { av = parseDate(av) || new Date(0); bv = parseDate(bv) || new Date(0); }
        else { av = String(av || '').toLowerCase(); bv = String(bv || '').toLowerCase(); }
        if (av < bv) return state.sortDir === 'asc' ? -1 : 1;
        if (av > bv) return state.sortDir === 'asc' ? 1 : -1;
        return 0;
      });

      const container = document.getElementById('tableBody');
      const empty = document.getElementById('emptyState');
      if (rows.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        empty.innerHTML = state.rows.length === 0
          ? '<div class="plate">No data loaded</div><div>Run the scraper, then reload to see live filings here.</div>'
          : '<div class="plate">No matches found</div><div>Nothing in the register matches your current filter criteria.</div>';
        document.getElementById('theadLabels').style.display = 'none';
        return;
      }
      empty.style.display = 'none';
      document.getElementById('theadLabels').style.display = '';

      let html = '';
      let lastMonth = null;
      rows.forEach(r => {
        const d = parseDate(r.date);
        const label = monthLabel(d);
        if (label !== lastMonth && state.sortKey === 'date') {
          html += `<div class="month-divider">${label}</div>`;
          lastMonth = label;
        }
        const isNew = !state.firstLoad && r.url && !state.seenUrls.has(r.url);
        html += `
          <div class="filing-row${isNew ? ' is-new' : ''}">
            <div class="title"><a href="${r.url}" target="_blank" rel="noopener">${r.title || 'Untitled'}</a></div>
            <div class="circno">${r.circular_no || '—'}</div>
            <div class="date">${r.date || '—'}</div>
            <div class="chip-group">
              ${r.category ? `<span class="chip category" title="${r.category}">${r.category}</span>` : ''}
              ${r.circular_type ? `<span class="chip" title="${r.circular_type}">${r.circular_type}</span>` : ''}
            </div>
          </div>`;
      });
      container.innerHTML = html;
    }

    async function loadData() {
      setStamp(true, 'Syncing…');
      try {
        const [rows, changelog] = await Promise.all([
          fetchJSON('/api/circulars'),
          fetchJSON('/api/changes'),
        ]);
        rows.forEach(r => { r.category = formatCategory(r.category); });
        state.rows = rows;
        state.changelog = changelog;
        renderBulletin(changelog);
        renderLedgerStrip(rows);
        populateFilters(rows);
        applyFiltersAndRender();
        rows.forEach(r => { if (r.url) state.seenUrls.add(r.url); });
        state.firstLoad = false;
        setStamp(true, 'Live · synced ' + new Date().toLocaleTimeString());
      } catch (err) {
        setStamp(false, 'Server unreachable');
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('emptyState').innerHTML =
          '<div class="plate">Not connected</div><div>Start the server with <code>python -m sbp_scraper.dashboard_server</code>, then refresh.</div>';
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('theadLabels').style.display = 'none';
      }
    }

    document.querySelectorAll('#theadLabels [data-key]').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.dataset.key;
        if (state.sortKey === key) { state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc'; }
        else { state.sortKey = key; state.sortDir = 'asc'; }
        document.querySelectorAll('#theadLabels .arrow').forEach(a => a.textContent = '');
        el.querySelector('.arrow').textContent = state.sortDir === 'asc' ? ' ▲' : ' ▼';
        applyFiltersAndRender();
      });
    });

    ['searchBox', 'categoryFilter', 'typeFilter'].forEach(id => {
      document.getElementById(id).addEventListener('input', applyFiltersAndRender);
    });

    const dateFromEl = document.getElementById('dateFrom');
    const dateToEl = document.getElementById('dateTo');

    dateFromEl.addEventListener('input', () => {
      if (dateFromEl.value) {
        dateToEl.min = dateFromEl.value;
        if (dateToEl.value && dateToEl.value < dateFromEl.value) dateToEl.value = dateFromEl.value;
      } else { dateToEl.removeAttribute('min'); }
      applyFiltersAndRender();
    });

    dateToEl.addEventListener('input', () => {
      if (dateToEl.value) {
        dateFromEl.max = dateToEl.value;
        if (dateFromEl.value && dateFromEl.value > dateToEl.value) dateFromEl.value = dateToEl.value;
      } else { dateFromEl.removeAttribute('max'); }
      applyFiltersAndRender();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('searchBox').value = '';
      document.getElementById('categoryFilter').value = '';
      document.getElementById('typeFilter').value = '';
      dateFromEl.value = '';
      dateToEl.value = '';
      dateFromEl.removeAttribute('max');
      dateToEl.removeAttribute('min');
      applyFiltersAndRender();
    });

    document.getElementById('refreshBtn').addEventListener('click', loadData);

    let autoTimer = null;
    document.getElementById('autoRefresh').addEventListener('change', (e) => {
      if (e.target.checked) { autoTimer = setInterval(loadData, 30000); }
      else { clearInterval(autoTimer); }
    });

    loadData();
  </script>

</body>

</html>
